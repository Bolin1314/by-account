<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF7F2" />
  <title>by_account · 記帳</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="by_account" />
  <style>
    /* =============== Font: jf-openhuninn 粉圓（繁中手寫風） =============== */
    @font-face {
      font-family: 'jf-openhuninn';
      src: url('https://cdn.jsdelivr.net/gh/justfont/open-huninn-font@v2.1/font/jf-openhuninn-2.1.ttf') format('truetype');
      font-weight: 100 900;
      font-display: swap;
    }

    /* =============== Design Tokens =============== */
    :root {
      --warm-bg:    #FAF7F2;
      --surface:    #FFFFFF;
      --soft:       #F5EFE6;
      --line:       #EDE6DD;
      --line-strong:#E0D6C7;
      --ink:        #3F2D20;
      --ink-2:      #5C463A;
      --muted:      #8B7B6E;
      --muted-2:    #B5A899;
      --honey:      #E29A2D;
      --honey-d:    #C57E1B;
      --honey-l:    #FCEFD6;
      --honey-xl:   #FEF7E6;
      --mint:       #5BA876;
      --mint-l:     #DDEEE3;
      --brick:      #C95B4D;
      --brick-l:    #F4DDDA;
      --yolk:       #E0B340;
      --yolk-l:     #F8EBC8;
      --lilac:      #7E6B9E;
      --lilac-l:    #E5DFEC;
      --shadow-card: 0 1px 2px rgba(63,45,32,.04), 0 4px 16px rgba(63,45,32,.05);
      --shadow-pop:  0 8px 24px rgba(63,45,32,.12);
      --shadow-honey:0 2px 0 rgba(197,126,27,.22), 0 6px 16px rgba(226,154,45,.20);
      --r-sm: 12px;
      --r-md: 16px;
      --r-lg: 20px;
      --r-xl: 24px;
      --r-2xl: 28px;
      --r-pill: 9999px;
      --space: 16px;
      --header-h: 56px;
      --nav-h: 64px;
      --safe-bottom: env(safe-area-inset-bottom);
      --safe-top: env(safe-area-inset-top);
    }

    /* =============== Reset =============== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'jf-openhuninn', -apple-system, BlinkMacSystemFont,
                   "Noto Sans TC", "PingFang TC", "Microsoft JhengHei",
                   "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: var(--ink);
      background: var(--warm-bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      font-feature-settings: 'tnum' on;
    }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    input, select, textarea { font: inherit; color: inherit; }
    a { color: var(--honey-d); text-decoration: none; }
    img, svg { display: block; max-width: 100%; }
    .num { font-variant-numeric: tabular-nums; font-weight: 600; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* =============== Backgrounds =============== */
    .bg-decor {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(80% 60% at 50% -10%, var(--honey-xl) 0%, transparent 60%),
        radial-gradient(60% 40% at 100% 110%, var(--lilac-l) 0%, transparent 70%),
        var(--warm-bg);
    }

    /* =============== Buttons =============== */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 20px; border-radius: var(--r-md); font-size: 15px; font-weight: 600;
      transition: transform .12s, background .15s, box-shadow .15s; user-select: none;
      min-height: 44px; line-height: 1;
    }
    .btn:active { transform: scale(.97); }
    .btn--primary {
      background: var(--honey); color: #fff;
      box-shadow: var(--shadow-honey);
    }
    .btn--primary:hover { background: var(--honey-d); }
    .btn--ghost { background: var(--soft); color: var(--ink); }
    .btn--ghost:hover { background: var(--line); }
    .btn--danger {
      background: var(--surface); color: var(--brick);
      border: 1px solid var(--brick-l);
    }
    .btn--danger:hover { background: var(--brick-l); }
    .btn--block { width: 100%; }
    .btn--lg { padding: 14px 24px; font-size: 16px; min-height: 52px; }
    .btn--icon {
      width: 40px; height: 40px; padding: 0; border-radius: var(--r-pill);
      color: var(--muted); font-size: 20px;
    }
    .btn--icon:hover { background: var(--soft); color: var(--ink); }

    /* =============== Form =============== */
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field__label { font-size: 13px; color: var(--muted); padding-left: 4px; }
    .input, .select, .textarea {
      width: 100%; padding: 13px 16px; border: 1.5px solid var(--line);
      border-radius: var(--r-md); background: var(--surface); color: var(--ink);
      font-size: 16px; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .input::placeholder, .textarea::placeholder { color: var(--muted-2); }
    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--honey); box-shadow: 0 0 0 4px var(--honey-l);
    }
    .input--with-icon { padding-left: 44px; }
    .input-wrap { position: relative; }
    .input-wrap__icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      font-size: 18px; opacity: .55; pointer-events: none;
    }
    .input--amount {
      text-align: right; font-size: 32px; font-weight: 700;
      letter-spacing: -.02em; padding: 18px 18px;
    }
    .textarea { min-height: 70px; resize: vertical; line-height: 1.5; }

    /* checkbox */
    .check { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
    .check__box {
      width: 22px; height: 22px; border: 1.5px solid var(--line-strong);
      border-radius: 6px; background: var(--surface);
      display: inline-flex; align-items: center; justify-content: center;
      transition: all .15s;
    }
    .check input { display: none; }
    .check input:checked + .check__box {
      background: var(--honey); border-color: var(--honey);
    }
    .check input:checked + .check__box::after {
      content: ''; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0;
      transform: rotate(45deg) translate(-1px,-1px);
    }
    .check__label { font-size: 14px; color: var(--ink-2); }

    /* toggle switch */
    .switch { position: relative; width: 44px; height: 26px; flex-shrink: 0; }
    .switch input { display: none; }
    .switch__track {
      position: absolute; inset: 0; background: var(--line-strong); border-radius: var(--r-pill);
      transition: background .2s;
    }
    .switch__thumb {
      position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
      background: #fff; border-radius: 50%; box-shadow: 0 1px 3px rgba(0,0,0,.2);
      transition: transform .2s;
    }
    .switch input:checked ~ .switch__track { background: var(--honey); }
    .switch input:checked ~ .switch__thumb { transform: translateX(18px); }

    /* =============== Card =============== */
    .card {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--r-2xl); box-shadow: var(--shadow-card);
    }
    .card__pad { padding: 20px; }
    .card__pad-sm { padding: 14px 16px; }

    /* =============== Chips / Badges =============== */
    .chip {
      display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px;
      border-radius: var(--r-pill); font-size: 12px; font-weight: 600;
    }
    .chip--honey { background: var(--honey-l); color: var(--honey-d); }
    .chip--mint  { background: var(--mint-l);  color: #2F7D55; }
    .chip--lilac { background: var(--lilac-l); color: var(--lilac); }
    .chip--soft  { background: var(--soft);    color: var(--muted); }

    /* =============== Layouts =============== */
    .app { min-height: 100vh; display: flex; flex-direction: column; }
    .app__header {
      position: sticky; top: 0; z-index: 30;
      padding-top: var(--safe-top);
      background: rgba(250,247,242,.85);
      backdrop-filter: saturate(180%) blur(16px);
      -webkit-backdrop-filter: saturate(180%) blur(16px);
      border-bottom: 1px solid var(--line);
    }
    .app__header-inner {
      height: var(--header-h); display: flex; align-items: center; justify-content: space-between;
      padding: 0 8px;
    }
    .app__title { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
    .app__main { flex: 1; padding: 16px; padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 24px); }
    .app__nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      padding-bottom: var(--safe-bottom);
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--line);
      box-shadow: 0 -2px 12px rgba(63,45,32,.04);
    }
    .app__nav-inner { display: grid; grid-template-columns: repeat(3, 1fr); height: var(--nav-h); }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      color: var(--muted); font-size: 11px; transition: color .15s;
    }
    .nav-item__icon { font-size: 22px; line-height: 1; }
    .nav-item.is-active { color: var(--honey-d); font-weight: 700; }
    .nav-item.is-active .nav-item__dot {
      width: 4px; height: 4px; border-radius: 50%; background: var(--honey); margin-top: 2px;
    }

    /* =============== Center page =============== */
    .center-page {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px;
    }

    /* =============== Logo =============== */
    .logo {
      width: 88px; height: 88px; border-radius: 22px;
      background: linear-gradient(135deg, var(--honey-l) 0%, #FFE2A8 100%);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 38px; font-weight: 800; color: var(--honey-d);
      box-shadow: 0 6px 18px rgba(226,154,45,.30);
    }
    .logo--img {
      padding: 0; background: var(--honey-l);
      object-fit: cover;
    }

    /* =============== Login =============== */
    .login-card { width: 100%; max-width: 380px; padding: 32px 24px; }
    .login-hero { text-align: center; margin-bottom: 24px; }
    .login-hero__title { font-size: 26px; font-weight: 800; margin-top: 14px; letter-spacing: -.02em; }
    .login-hero__sub { color: var(--muted); font-size: 14px; margin-top: 4px; }

    /* =============== Home — ledger list =============== */
    .greet { padding: 4px 4px 16px; }
    .greet__hi { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
    .greet__sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .ledger-list { display: flex; flex-direction: column; gap: 12px; }
    .ledger-card {
      display: flex; align-items: center; gap: 14px; padding: 16px;
      width: 100%; text-align: left; background: var(--surface);
      border: 1px solid var(--line); border-radius: var(--r-2xl);
      box-shadow: var(--shadow-card); transition: transform .12s, box-shadow .15s;
    }
    .ledger-card:active { transform: scale(.985); }
    .ledger-card:hover { box-shadow: var(--shadow-pop); }
    .ledger-card__icon {
      width: 52px; height: 52px; border-radius: 16px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 24px;
    }
    .ledger-card__icon--shared  { background: var(--honey-l); }
    .ledger-card__icon--private { background: var(--lilac-l); }
    .ledger-card__icon--locked  { background: var(--lilac-l); opacity: .65; }
    .ledger-card__body { flex: 1; min-width: 0; }
    .ledger-card__name { font-weight: 700; font-size: 16px; color: var(--ink); }
    .ledger-card__meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
    .ledger-card__role { color: var(--muted); font-size: 12px; }
    .ledger-card__chev { color: var(--muted-2); font-size: 22px; }

    /* empty state */
    .empty {
      padding: 48px 20px; text-align: center;
      display: flex; flex-direction: column; gap: 12px; align-items: center;
    }
    .empty__icon { font-size: 56px; }
    .empty__title { font-weight: 700; color: var(--ink); }
    .empty__hint { color: var(--muted); font-size: 14px; line-height: 1.6; }

    /* =============== Ledger detail =============== */
    .month-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 8px 14px;
    }
    .month-bar__label { font-size: 17px; font-weight: 700; }
    .summary {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0;
      padding: 18px 8px; text-align: center;
    }
    .summary__cell { padding: 0 4px; }
    .summary__cell + .summary__cell { border-left: 1px solid var(--line); }
    .summary__label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .summary__value { font-size: 17px; font-weight: 700; }
    .summary__value--mint { color: var(--mint); }
    .summary__value--brick { color: var(--brick); }
    .day-group { margin-bottom: 18px; }
    .day-group__date {
      font-size: 12px; color: var(--muted); padding: 0 4px 8px; font-weight: 600;
    }
    .records { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-2xl); overflow: hidden; box-shadow: var(--shadow-card); }
    .record {
      display: flex; align-items: center; gap: 12px; padding: 14px 16px;
    }
    .record + .record { border-top: 1px solid var(--line); }
    .record__badges { margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
    .amount--strike { text-decoration: line-through; opacity: .6; }
    .record--btn { width: 100%; text-align: left; transition: background .12s; cursor: pointer; border: none; background: transparent; }
    .record--btn:active { background: var(--soft); }
    .record--btn:hover { background: var(--soft); }
    .record__chev {
      color: var(--muted-2); font-size: 22px; margin-left: 4px; line-height: 1;
      flex-shrink: 0;
    }
    .record--btn:hover .record__chev { color: var(--honey-d); }
    .record__icon {
      width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 20px;
      background: var(--honey-l);
    }
    .record__icon--transfer { background: var(--soft); }
    .record__body { flex: 1; min-width: 0; }
    .record__title { font-weight: 600; color: var(--ink); }
    .record__sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .record__amount { font-size: 16px; }
    .amount--mint { color: var(--mint); }
    .amount--brick { color: var(--brick); }
    .amount--muted { color: var(--muted); }

    .notice {
      padding: 12px 14px; font-size: 13px; color: var(--ink-2);
      background: var(--yolk-l); border: 1px solid #E8D49A; border-radius: var(--r-md);
      margin-bottom: 12px;
    }

    /* =============== Add record =============== */
    .type-tabs {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
      padding: 6px; background: var(--soft); border-radius: var(--r-md);
    }
    .type-tab {
      padding: 12px 8px; border-radius: 12px; font-weight: 600; font-size: 14px;
      color: var(--muted); transition: all .15s; display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    .type-tab.is-active { background: var(--surface); color: var(--ink); box-shadow: 0 2px 6px rgba(63,45,32,.08); }
    .type-tab.is-active.t-expense { color: var(--brick); }
    .type-tab.is-active.t-income  { color: var(--mint); }
    .type-tab.is-active.t-transfer{ color: var(--lilac); }

    .cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .cat-tile {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 12px 4px; border: 1.5px solid var(--line); background: var(--surface);
      border-radius: var(--r-md); transition: all .15s;
    }
    .cat-tile__icon { font-size: 26px; }
    .cat-tile__img  { width: 40px; height: 40px; object-fit: contain; }
    .cat-tile__name { font-size: 12px; color: var(--ink-2); }
    .cat-tile.is-active {
      background: var(--honey-l); border-color: var(--honey);
      box-shadow: 0 2px 8px rgba(226,154,45,.20);
    }
    .cat-tile.is-active .cat-tile__name { color: var(--honey-d); font-weight: 600; }

    /* =============== Settings =============== */
    .profile {
      display: flex; align-items: center; gap: 14px; padding: 18px 16px;
    }
    .profile__avatar {
      width: 56px; height: 56px; border-radius: 18px;
      background: var(--honey-l); color: var(--honey-d);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; font-weight: 700;
      overflow: hidden; flex-shrink: 0;
      position: relative;
    }
    .profile__avatar img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .profile__avatar--clickable { cursor: pointer; transition: transform .15s; }
    .profile__avatar--clickable:active { transform: scale(.95); }
    .profile__avatar--clickable::after {
      content: ''; position: absolute; bottom: -2px; right: -2px;
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--surface) url('icons/edit.png') center / 18px no-repeat;
      border: 2px solid var(--warm-bg);
    }
    .profile__name { font-size: 17px; font-weight: 700; }
    .profile__meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .list-item {
      display: flex; align-items: center; gap: 12px; padding: 14px 16px;
      width: 100%; text-align: left; transition: background .12s;
    }
    .list-item:active { background: var(--soft); }
    .list-item + .list-item { border-top: 1px solid var(--line); }
    .list-item__icon { width: 32px; text-align: center; font-size: 18px; }
    .list-item__label { flex: 1; font-size: 15px; color: var(--ink); }
    .list-item__chev { color: var(--muted-2); }
    .list-item--danger .list-item__label { color: var(--brick); }

    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px;
    }
    .toggle-row + .toggle-row { border-top: 1px solid var(--line); }
    .toggle-row__main { flex: 1; padding-right: 12px; }
    .toggle-row__title { font-size: 15px; color: var(--ink); }
    .toggle-row__sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* =============== Side menu (overlay) =============== */
    .overlay {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(63,45,32,.45);
      display: flex; justify-content: flex-end;
      animation: fadeIn .18s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
    @keyframes slideIn { from { transform: translateX(100%) } to { transform: translateX(0) } }
    .side-menu {
      width: 78%; max-width: 320px; height: 100%; background: var(--warm-bg);
      padding: 24px 20px; padding-top: calc(20px + var(--safe-top)); padding-bottom: calc(20px + var(--safe-bottom));
      display: flex; flex-direction: column; gap: 10px;
      box-shadow: -8px 0 24px rgba(0,0,0,.10);
      animation: slideIn .22s ease-out;
    }
    .side-menu__user {
      display: flex; align-items: center; gap: 12px; padding-bottom: 16px;
      border-bottom: 1px solid var(--line); margin-bottom: 8px;
    }
    .side-menu__btn {
      text-align: left; padding: 12px 14px; border-radius: var(--r-md);
      color: var(--ink); transition: background .12s; font-size: 15px;
      display: flex; align-items: center; gap: 10px;
    }
    .side-menu__btn:active { background: var(--soft); }
    .side-menu__btn--danger { color: var(--brick); }
    .side-menu__footer {
      margin-top: auto; text-align: center; font-size: 11px; color: var(--muted-2);
    }

    /* =============== Toast =============== */
    .toast-wrap {
      position: fixed; top: calc(16px + var(--safe-top)); left: 50%;
      transform: translateX(-50%); z-index: 60; pointer-events: none;
    }
    .toast {
      padding: 10px 18px; border-radius: var(--r-pill);
      box-shadow: var(--shadow-pop); font-size: 14px; color: #fff;
      background: var(--ink); display: flex; align-items: center; gap: 8px;
    }
    .toast--error   { background: var(--brick); }
    .toast--success { background: var(--mint); }
    .toast.is-show  { animation: toastIn .2s ease-out; }
    @keyframes toastIn { from { transform: translateY(-12px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }

    /* =============== Misc =============== */
    .stack { display: flex; flex-direction: column; }
    .stack > * + * { margin-top: 16px; }
    .stack-sm > * + * { margin-top: 10px; }
    .stack-xs > * + * { margin-top: 6px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .grow { flex: 1; min-width: 0; }
    .center-text { text-align: center; }
    .hidden { display: none !important; }

    /* radio pill group */
    .radio-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .radio-pill {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 12px; border: 1.5px solid var(--line); border-radius: var(--r-md);
      background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 600;
      color: var(--ink-2); transition: all .15s;
    }
    .radio-pill input { display: none; }
    .radio-pill:has(input:checked) {
      background: var(--honey-l); border-color: var(--honey); color: var(--honey-d);
      box-shadow: 0 2px 8px rgba(226,154,45,.18);
    }

    /* advanced disclosure */
    details.advanced {
      border-top: 1px solid var(--line); margin-top: 4px; padding-top: 14px;
    }
    details.advanced summary {
      cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted);
      padding: 4px 0; user-select: none; list-style: none;
    }
    details.advanced summary::-webkit-details-marker { display: none; }
    details.advanced summary::before {
      content: '▸ '; display: inline-block; transition: transform .15s;
    }
    details.advanced[open] summary::before { transform: rotate(90deg); }
    details.advanced summary:hover { color: var(--ink); }
    details.advanced > .stack { padding-top: 12px; }

    .field__hint { font-size: 12px; color: var(--muted); padding: 4px; line-height: 1.5; }
    .field__hint--warn { color: var(--brick); }
    .copy-chip {
      display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px;
      background: var(--soft); border-radius: 6px; font-family: monospace;
      font-size: 12px; color: var(--ink); cursor: pointer; user-select: all;
    }

    /* =============== 浣熊圖示通用樣式 =============== */
    /* 帳本卡左側圖（52x52 容器） */
    .ledger-card__icon img { width: 100%; height: 100%; object-fit: contain; padding: 4px; box-sizing: border-box; }

    /* 記錄列圖（40x40 容器） */
    .record__icon img { width: 100%; height: 100%; object-fit: contain; padding: 3px; box-sizing: border-box; }
    .record__icon .emoji-fallback { font-size: 20px; }

    /* 底部 nav 圖（24x24） */
    .nav-item__img { width: 28px; height: 28px; object-fit: contain; }
    .nav-item__emoji { font-size: 22px; line-height: 1; }

    /* 空狀態大圖 */
    .empty__img { width: 180px; height: 180px; object-fit: contain; margin: 0 auto; }
    .empty__img--loading { width: 120px; height: 120px; animation: bounce 1.6s ease-in-out infinite; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }
    /* 行內小 icon（可放 button 文字旁） */
    .icon-inline { display: inline-block; vertical-align: -5px; width: 22px; height: 22px; object-fit: contain; }
    .icon-inline-sm { width: 18px; height: 18px; }
    /* header 圓鈕內的圖 */
    .btn--icon img { width: 22px; height: 22px; object-fit: contain; }

    /* 問候語小圖 */
    .greet__icon { display: inline-block; vertical-align: -8px; width: 32px; height: 32px; object-fit: contain; margin-right: 2px; }

    /* 類型 tab 小圖 */
    .type-tab__img { display: inline-block; vertical-align: -5px; width: 22px; height: 22px; object-fit: contain; margin-right: 2px; }

    /* iPhone safe area for inputs (avoid auto-zoom) */
    @media (max-width: 480px) {
      .input, .select, .textarea { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="bg-decor"></div>
  <div id="app"></div>
  <div class="toast-wrap hidden" id="toast"><div class="toast" id="toast-msg"></div></div>

  <script>
  // =====================================================================
  // 1. 設定 / 狀態
  // =====================================================================
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwoTAXj1rnwLjaXoZhLrYGTE7CCpxHmVFwrSeNS3W16zIjHmv2yV9znPrvn-ey8UOoy1w/exec';

  const LS_URL     = 'by_account:web_app_url';
  const LS_TOKEN   = 'by_account:session_token';
  const LS_USER    = 'by_account:user';
  const LS_LEDGER  = 'by_account:current_ledger';
  const LS_EXPIRES = 'by_account:expires_at';
  const LS_AVATAR  = 'by_account:avatar';

  const state = {
    url:    localStorage.getItem(LS_URL) || WEB_APP_URL,
    token:  localStorage.getItem(LS_TOKEN) || '',
    user:   JSON.parse(localStorage.getItem(LS_USER) || 'null'),
    ledger: JSON.parse(localStorage.getItem(LS_LEDGER) || 'null'),
    page: '',
    cache: { sheets: null, accounts: null, categories: null, records: null, user_names: null }
  };
  function setUrl(v)   { state.url = v; localStorage.setItem(LS_URL, v); }
  function setToken(v) { state.token = v; localStorage.setItem(LS_TOKEN, v); }
  function setUser(v)  { state.user = v; localStorage.setItem(LS_USER, JSON.stringify(v)); }
  function setLedger(v){ state.ledger = v; localStorage.setItem(LS_LEDGER, JSON.stringify(v)); state.cache.accounts = state.cache.categories = state.cache.records = null; }
  function setExpiresAt(iso) {
    if (iso) localStorage.setItem(LS_EXPIRES, iso);
    else localStorage.removeItem(LS_EXPIRES);
    scheduleExpiryCheck();
  }
  function clearAuth() {
    setToken(''); setUser(null); setLedger(null); setExpiresAt(null);
    state.cache = { sheets: null, accounts: null, categories: null };
  }

  // ============ 自動登出機制 ============
  let _expiryTimer = null;
  function scheduleExpiryCheck() {
    if (_expiryTimer) { clearTimeout(_expiryTimer); _expiryTimer = null; }
    const iso = localStorage.getItem(LS_EXPIRES);
    if (!iso || !state.token) return;
    const ms = new Date(iso).getTime() - Date.now();
    if (ms <= 0) { handleSessionExpired('local'); return; }
    // setTimeout 上限 ~24.8 天，clamp 一下
    _expiryTimer = setTimeout(() => handleSessionExpired('timer'), Math.min(ms, 2_000_000_000));
  }
  function handleSessionExpired(reason) {
    if (!state.token && !localStorage.getItem(LS_TOKEN)) return;
    clearAuth();
    toast('登入已逾時，請重新登入', 'error');
    navigate('login');
  }
  // 分頁從背景喚醒時重新檢查（避免 setTimeout 在 sleep 時失效）
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') scheduleExpiryCheck();
  });
  // 多分頁同步：別的分頁登出 → 本分頁也跟著踢回 login
  window.addEventListener('storage', (e) => {
    if (e.key === LS_TOKEN && !e.newValue && state.token) {
      state.token = ''; state.user = null;
      toast('已從其他分頁登出', 'error');
      navigate('login');
    }
    if (e.key === LS_EXPIRES) scheduleExpiryCheck();
  });

  // =====================================================================
  // 2. API
  // =====================================================================
  async function api(action, payload) {
    if (!state.url) throw new Error('未設定 Web App URL');
    const body = JSON.stringify({ action, payload: payload || {}, session_token: state.token });
    const res = await fetch(state.url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body
    });
    const json = await res.json().catch(() => ({ ok: false, error: 'bad_response' }));
    if (!json.ok) {
      if (['invalid_session','session_expired','not_logged_in'].includes(json.error)) {
        handleSessionExpired('api');
      }
      throw new Error(json.error || json.message || '未知錯誤');
    }
    return json.data;
  }

  // =====================================================================
  // 3. UI 工具
  // =====================================================================
  function el(html) {
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstChild;
  }
  function render(html) {
    const root = document.getElementById('app');
    root.innerHTML = '';
    root.appendChild(el(html));
    window.scrollTo(0, 0);
  }
  function toast(msg, kind) {
    const box = document.getElementById('toast');
    const m = document.getElementById('toast-msg');
    m.textContent = msg;
    m.className = 'toast ' + (kind === 'error' ? 'toast--error' : kind === 'success' ? 'toast--success' : '');
    box.classList.remove('hidden');
    m.classList.remove('is-show'); void m.offsetWidth; m.classList.add('is-show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => box.classList.add('hidden'), 2400);
  }
  function fmtMoney(n, cur) {
    const s = Number(n).toLocaleString('zh-TW', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    return (cur || 'TWD') === 'TWD' ? '$' + s : s + ' ' + cur;
  }
  function todayIso() { return new Date().toISOString().slice(0,10); }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, m =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  // ============ 自訂浣熊 icon 圖（沒對應的 fallback 用 emoji） ============
  const CAT_ICONS = {
    '飲食':     'icons/cat-food.png',
    '交通':     'icons/cat-transport.png',
    '購物':     'icons/cat-shopping.png',
    '居家':     'icons/cat-home.png',
    '醫療':     'icons/cat-medical.png',
    '娛樂':     'icons/cat-entertainment.png',
    '其他':     'icons/cat-other.png',
    '薪資':     'icons/cat-salary.png',
    '獎金':     'icons/cat-bonus.png',
    '其他收入': 'icons/cat-other-income.png'
  };
  const TYPE_ICONS = {
    expense:  'icons/type-expense.png',
    income:   'icons/type-income.png',
    transfer: 'icons/type-transfer.png'
  };
  const NAV_ICONS = {
    home:     'icons/nav-home.png',
    add:      'icons/nav-add.png',
    settings: 'icons/nav-settings.png'
  };
  function ledgerIconSrc(s) {
    if (s.locked) return 'icons/ledger-locked.png';
    if (s.visibility === 'private') return 'icons/ledger-private.png';
    return 'icons/ledger-shared.png';
  }
  // Phase 4 雜項
  const MISC_ICONS = {
    loading:    'icons/loading.png',
    back:       'icons/back.png',
    menu:       'icons/menu.png',
    logout:     'icons/logout.png',
    connection: 'icons/connection.png',
    users:      'icons/users.png',
    warning:    'icons/warning.png',
    save:       'icons/save.png',
    edit:       'icons/edit.png',
    forbidden:  'icons/forbidden.png'
  };
  function imgTag(src, alt) {
    return `<img src="${src}" alt="${alt || ''}" />`;
  }
  function emojiSpan(emoji) {
    return `<span class="emoji-fallback">${emoji}</span>`;
  }

  // ============ 大頭貼（per-device，存於 localStorage） ============
  function getAvatar() { return localStorage.getItem(LS_AVATAR) || ''; }
  function setAvatar(v) {
    if (v) localStorage.setItem(LS_AVATAR, v);
    else localStorage.removeItem(LS_AVATAR);
  }
  function avatarHtml(u) {
    const av = getAvatar();
    if (av) return `<img src="${av}" alt="" />`;
    const init = (u && (u.display_name || u.account) || '?').slice(0, 1).toUpperCase();
    return escapeHtml(init);
  }
  function resizeToDataUrl(file, maxSize, quality) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = () => { img.src = reader.result; };
      reader.onerror = reject;
      img.onload = () => {
        const side = Math.min(img.width, img.height);
        const sx = (img.width - side) / 2;
        const sy = (img.height - side) / 2;
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = maxSize;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, sx, sy, side, side, 0, 0, maxSize, maxSize);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  function pickAvatar() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = async () => {
      const file = input.files && input.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) return toast('請選圖片檔', 'error');
      if (file.size > 10 * 1024 * 1024) return toast('檔案太大（>10MB）', 'error');
      try {
        const dataUrl = await resizeToDataUrl(file, 256, 0.85);
        setAvatar(dataUrl);
        toast('已更新大頭貼 ✨', 'success');
        if (state.page === 'settings') pageSettings();
      } catch (e) {
        toast('讀取圖片失敗', 'error');
      }
    };
    input.click();
  }
  function resetAvatar() {
    if (!confirm('確定移除大頭貼？')) return;
    setAvatar('');
    toast('已移除大頭貼', 'success');
    if (state.page === 'settings') pageSettings();
  }
  window.pickAvatar = pickAvatar;
  window.resetAvatar = resetAvatar;
  function greetingHi() {
    const h = new Date().getHours();
    let key, text;
    if (h < 5)       { key = 'night';     text = '夜深了'; }
    else if (h < 11) { key = 'morning';   text = '早安'; }
    else if (h < 14) { key = 'noon';      text = '午安'; }
    else if (h < 18) { key = 'afternoon'; text = '午後好'; }
    else if (h < 22) { key = 'night';     text = '晚安'; }
    else             { key = 'night';     text = '夜深了'; }
    return `<img class="greet__icon" src="icons/time-${key}.png" alt="" /> ${text}`;
  }

  // =====================================================================
  // 4. Router
  // =====================================================================
  // 每次路由換頁時 ++，async 頁面函式在 await 後檢查還是不是當前 token，
  // 不是就放棄 render，避免「舊頁的 fetch 回來把新頁畫面蓋掉」。
  let _routeToken = 0;
  function navigate(page, params) {
    state.page = page;
    location.hash = '#' + page + (params ? '?' + new URLSearchParams(params) : '');
    routeFromHash();
  }
  function routeFromHash() {
    _routeToken++;
    const raw = location.hash.replace(/^#/, '') || 'home';
    const [page, query] = raw.split('?');
    const params = Object.fromEntries(new URLSearchParams(query || ''));
    state.page = page;
    if (!state.token && page !== 'login' && page !== 'reset-url') return pageLogin();
    switch (page) {
      case 'login':       return pageLogin();
      case 'home':        return pageHome();
      case 'ledger':      return pageLedger(params);
      case 'add':         return pageAddRecord();
      case 'edit':        return pageEditRecord(params);
      case 'settings':    return pageSettings();
      case 'new-ledger':  return pageNewLedger();
      case 'reset-url':   return pageSetupUrl(true);
      default:            return pageHome();
    }
  }
  window.addEventListener('hashchange', routeFromHash);

  // =====================================================================
  // 5. App shell + Side menu
  // =====================================================================
  function appShell(content, opts = {}) {
    const back = opts.back
      ? `<button class="btn--icon" onclick="history.back()" aria-label="返回"><img src="icons/back.png" alt="" /></button>`
      : `<div style="width:40px"></div>`;
    return `
      <div class="app">
        <header class="app__header">
          <div class="app__header-inner">
            ${back}
            <div class="app__title">${escapeHtml(opts.title || 'by_account')}</div>
            <button class="btn--icon" onclick="showMenu()" aria-label="選單"><img src="icons/menu.png" alt="" /></button>
          </div>
        </header>
        <main class="app__main">${content}</main>
        <nav class="app__nav">
          <div class="app__nav-inner">
            ${navItem('home',     '🏠', '帳本')}
            ${navItem('add',      '➕', '記帳')}
            ${navItem('settings', '⚙️', '設定')}
          </div>
        </nav>
      </div>
    `;
  }
  function navItem(id, icon, label) {
    const active = state.page === id ? ' is-active' : '';
    const src = NAV_ICONS[id];
    const iconHtml = src
      ? `<img class="nav-item__img" src="${src}" alt="" />`
      : `<span class="nav-item__emoji">${icon}</span>`;
    return `
      <button class="nav-item${active}" onclick="location.hash='${id}'">
        ${iconHtml}
        <span>${label}</span>
        ${state.page === id ? '<span class="nav-item__dot"></span>' : ''}
      </button>
    `;
  }
  function showMenu() {
    const u = state.user || {};
    const html = `
      <div class="overlay" id="overlay">
        <aside class="side-menu" onclick="event.stopPropagation()">
          <div class="side-menu__user">
            <div class="profile__avatar" style="width:48px;height:48px;font-size:22px;border-radius:14px">${avatarHtml(u)}</div>
            <div>
              <div style="font-weight:700">${escapeHtml(u.display_name || u.account || '')}</div>
              <div style="font-size:12px;color:var(--muted)">${escapeHtml(u.role || '')}</div>
            </div>
          </div>
          <button class="side-menu__btn" onclick="goAndCloseMenu('settings')">⚙️ <span>設定</span></button>
          <button class="side-menu__btn side-menu__btn--danger" onclick="logout()"><img class="icon-inline" src="icons/logout.png" alt="" /> <span>登出</span></button>
          <div class="side-menu__footer">by_account · v0.1</div>
        </aside>
      </div>
    `;
    document.body.insertAdjacentHTML('beforeend', html);
    document.getElementById('overlay').onclick = () => closeMenu();
  }
  function closeMenu() { document.getElementById('overlay')?.remove(); }
  function goAndCloseMenu(p) { closeMenu(); location.hash = p; }
  async function logout() {
    try { await api('logout'); } catch(e){}
    clearAuth(); closeMenu(); navigate('login');
  }
  window.showMenu = showMenu; window.closeMenu = closeMenu;
  window.goAndCloseMenu = goAndCloseMenu; window.logout = logout;

  // =====================================================================
  // 6. 頁面：登入
  // =====================================================================
  function pageLogin() {
    render(`
      <div class="center-page">
        <div class="card login-card">
          <div class="login-hero">
            <img src="icons/icon-192.png" alt="logo" class="logo logo--img" />
            <div class="login-hero__title">by_account</div>
            <div class="login-hero__sub">輕鬆管帳，安心生活 ✨</div>
          </div>
          <div class="stack">
            <div class="input-wrap">
              <span class="input-wrap__icon">👤</span>
              <input id="account" class="input input--with-icon" placeholder="帳號" autocomplete="username" />
            </div>
            <div class="input-wrap">
              <span class="input-wrap__icon">🔒</span>
              <input id="password" class="input input--with-icon" type="password" placeholder="密碼" autocomplete="current-password" />
            </div>
            <label class="check">
              <input type="checkbox" id="remember" />
              <span class="check__box"></span>
              <span class="check__label">記住我（30 天）</span>
            </label>
            <button id="loginBtn" class="btn btn--primary btn--lg btn--block">登入</button>
          </div>
        </div>
      </div>
    `);
    document.getElementById('loginBtn').onclick = doLogin;
    document.getElementById('password').onkeydown = e => { if (e.key === 'Enter') doLogin(); };
    setTimeout(() => document.getElementById('account').focus(), 60);
  }
  async function doLogin() {
    const account = document.getElementById('account').value.trim();
    const password = document.getElementById('password').value;
    const remember = document.getElementById('remember').checked;
    if (!account || !password) return toast('請輸入帳號與密碼', 'error');
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = '登入中…';
    try {
      const r = await api('login', { account, password, remember_me: remember, user_agent: navigator.userAgent });
      setToken(r.session_token); setUser(r.user); setExpiresAt(r.expires_at);
      toast('歡迎回來，' + (r.user.display_name || r.user.account), 'success');
      navigate('home');
    } catch (e) {
      toast('登入失敗：' + friendlyErr(e.message), 'error');
      btn.disabled = false; btn.textContent = '登入';
    }
  }
  function friendlyErr(code) {
    return ({
      bad_credentials: '帳號或密碼不正確',
      account_temporarily_locked: '失敗次數過多，請 15 分鐘後再試',
      missing_credentials: '帳號密碼不能空白',
      not_logged_in: '尚未登入',
      session_expired: '登入逾時，請重新登入',
      forbidden: '沒有權限',
      private_view_blocked: '私人帳本擁有者尚未授權',
      sheet_not_found: '找不到帳本',
      missing_account: '請輸入帳號',
      missing_amount: '請輸入金額',
      missing_category: '請選類別',
      missing_account_id: '請選帳戶'
    })[code] || code;
  }

  // =====================================================================
  // 7. 頁面：首頁（帳本列表）
  // =====================================================================
  async function pageHome() {
    const tk = _routeToken;
    render(appShell(`<div class="empty"><img class="empty__img empty__img--loading" src="icons/loading.png" alt="" /><div class="empty__hint">讀取中…</div></div>`, { title: '我的帳本' }));
    let sheets;
    try {
      sheets = await api('list_my_sheets');
      state.cache.sheets = sheets;
    } catch (e) {
      if (tk !== _routeToken) return;
      return render(appShell(`<div class="card card__pad" style="color:var(--brick)">載入失敗：${escapeHtml(friendlyErr(e.message))}</div>`, { title: '我的帳本' }));
    }
    if (tk !== _routeToken) return;
    const u = state.user || {};
    const greet = `
      <div class="greet">
        <div class="greet__hi">${greetingHi()}<span style="margin-left:4px">${escapeHtml(u.display_name || u.account || '')}</span></div>
        <div class="greet__sub">今天也要好好記帳喔～</div>
      </div>
    `;
    if (!sheets.length) {
      return render(appShell(greet + `
        <div class="card empty">
          <img class="empty__img" src="icons/empty-no-ledger.png" alt="" />
          <div class="empty__title">還沒有任何帳本</div>
          <div class="empty__hint">${u.role==='user' ? '請聯絡管理員開一本給你 🙋' : '到「設定」建立第一本帳本吧 ✨'}</div>
        </div>
      `, { title: '我的帳本' }));
    }
    const cards = sheets.map(s => {
      const iconCls = s.locked ? 'ledger-card__icon--locked' : (s.visibility==='private' ? 'ledger-card__icon--private' : 'ledger-card__icon--shared');
      const iconSrc = ledgerIconSrc(s);
      const chip   = s.locked
        ? '<span class="chip chip--lilac">🔒 無權檢視</span>'
        : (s.visibility==='private'
            ? '<span class="chip chip--lilac">私人</span>'
            : '<span class="chip chip--honey">共同</span>');
      return `
        <button class="ledger-card" data-id="${s.id}" data-locked="${s.locked}">
          <div class="ledger-card__icon ${iconCls}"><img src="${iconSrc}" alt="" /></div>
          <div class="ledger-card__body">

  async function pageLedger(params) {

    const year  = Number(params.year)  || now.getFullYear();

    render(appShell(`<div class="empty"><img class="empty__img empty__img--loading" src="icons/loading.png" alt="" /><div class="empty__hint">讀取中…</div></div>`, { title: ledger.name, back: true }));
    let res, cats, accts;
    try {
      // 一次拿 records + categories + accounts + user_names
      const data = await api('list_ledger_view', { sheet_id: ledger.id, year, month, limit: 500 });
      res = data.records; cats = data.categories; accts = data.accounts;
      state.cache.categories = cats;
      state.cache.accounts = accts;
      state.cache.records = res.items;
      state.cache.user_names = data.user_names || {};
    } catch (e) {
      if (tk !== _routeToken) return;
      return render(appShell(`<div class="card card__pad" style="color:var(--brick)">載入失敗：${escapeHtml(friendlyErr(e.message))}</div>`, { title: ledger.name, back: true }));
    }
    if (tk !== _routeToken) return;

    const catMap = {}; cats.forEach(c => catMap[c.id] = c);
    const acctMap = {}; accts.forEach(a => acctMap[a.id] = a);

    // 計入總和時排除「從提款現金消費」標記的（避免重複計算）
    const countable = res.items.filter(r => !r.excluded_from_total);
    const inc = countable.filter(r => r.type === 'income').reduce((s,r) => s + Number(r.amount), 0);
    const exp = countable.filter(r => r.type === 'expense').reduce((s,r) => s + Number(r.amount), 0);

    const grouped = {};
    res.items.forEach(r => { (grouped[r.date] = grouped[r.date] || []).push(r); });
    const dates = Object.keys(grouped).sort().reverse();

    const list = dates.length ? dates.map(d => `
      <div class="day-group">
        <div class="day-group__date">${d}</div>
        <div class="records">${grouped[d].map(r => recordRow(r, catMap, acctMap, ledger.currency)).join('')}</div>

            <div class="summary__value summary__value--brick num">${fmtMoney(exp, ledger.currency)}</div>

          <div class="summary__cell">

            <div class="summary__value num">${fmtMoney(inc-exp, ledger.currency)}</div>
          </div>
        </div>
      </div>

      ${list}
    `, { title: ledger.name, back: true }));
  }
  function recordRow(r, catMap, acctMap, cur) {
    const cat = catMap[r.category_id];
    const acct = acctMap[r.account_id];
    const sign = r.type === 'income' ? '+' : (r.type === 'expense' ? '−' : '↔');
    const amtCls = r.type === 'income' ? 'amount--mint' : (r.type === 'expense' ? 'amount--brick' : 'amount--muted');
    const iconCls = r.type === 'transfer' ? 'record__icon record__icon--transfer' : 'record__icon';
    // 圖示優先順序：轉帳 → type 圖；類別有對應圖 → 用圖；否則 fallback emoji
    let iconHtml;
    if (r.type === 'transfer') {
      iconHtml = `<img src="${TYPE_ICONS.transfer}" alt="" />`;
    } else if (cat && CAT_ICONS[cat.name]) {
      iconHtml = `<img src="${CAT_ICONS[cat.name]}" alt="" />`;
    } else {
      iconHtml = `<span class="emoji-fallback">${cat ? cat.icon : '📌'}</span>`;
    }
    const label = r.type === 'transfer'
      ? `${acct ? acct.name : ''} → ${(acctMap[r.transfer_to_account_id] || {}).name || ''}`
      : (cat ? cat.name : '未分類');
    const sub = [r.note, acct && acct.name].filter(Boolean).map(escapeHtml).join(' · ');
    const badges = [];
    if (r.excluded_from_total) badges.push('<span class="chip chip--soft">💵 不計入</span>');
    if (r.partner_settled)     badges.push('<span class="chip chip--mint">✓ 已結算</span>');
    const badgesHtml = badges.length ? `<div class="record__badges">${badges.join('')}</div>` : '';
    return `
      <button class="record record--btn" onclick="location.hash='edit?id=${encodeURIComponent(r.id)}'" title="點選編輯">
        <div class="${iconCls}">${iconHtml}</div>
        <div class="record__body">
          <div class="record__title truncate">${escapeHtml(label)}</div>
          ${sub ? `<div class="record__sub truncate">${sub}</div>` : ''}
          ${badgesHtml}
        </div>
        <div class="record__amount num ${amtCls} ${r.excluded_from_total?'amount--strike':''}">${sign}${fmtMoney(r.amount, cur)}</div>
        <span class="record__chev" aria-hidden="true">›</span>
      </button>
    `;
  }
  function changeMonth(y, m, d) {
    let ny = y, nm = m + d;
    if (nm > 12) { nm = 1; ny++; }
    if (nm < 1)  { nm = 12; ny--; }
    navigate('ledger', { id: state.ledger.id, year: ny, month: nm });
  }

  function userNameOf(uid) {
    if (!uid) return '—';
    if (String(uid).indexOf('sync:') === 0) return '🔁 ' + uid.slice(5) + ' 同步';
    const map = state.cache.user_names || {};
    return map[uid] || '（未知）';
  }
  function fmtDateTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    const y = d.getFullYear();
    const M = String(d.getMonth()+1).padStart(2,'0');
    const D = String(d.getDate()).padStart(2,'0');
    const h = String(d.getHours()).padStart(2,'0');
    const m = String(d.getMinutes()).padStart(2,'0');
    return `${y}/${M}/${D} ${h}:${m}`;
  }

        category_id: curType === 'transfer' ? '' : (curCatId || ''),
        transfer_to_account_id: curType === 'transfer' ? document.getElementById('acct2').value : '',
        excluded_from_total: document.getElementById('excludedFromTotal').checked,
        partner_settled:     document.getElementById('partnerSettled').checked
      };
      if (curType === 'transfer' && payload.account_id === payload.transfer_to_account_id)
        return toast('同一帳戶不可互轉', 'error');
      if ((curType === 'expense' || curType === 'income') && !curCatId)
        return toast('請選類別', 'error');

      const btn = document.getElementById('saveBtn');
      btn.disabled = true; btn.textContent = '儲存中…';
      try {
        await api('update_record', payload);
        toast('已儲存修改 ✨', 'success');
        state.cache.records = null;  // 強制下次重抓
        navigate('ledger', { id: state.ledger.id });
      } catch (e) {
        toast('儲存失敗：' + friendlyErr(e.message), 'error');
        btn.disabled = false; btn.innerHTML = '<img class="icon-inline" src="icons/save.png" alt="" /> 儲存修改';
      }
    };

    document.getElementById('deleteBtn').onclick = async () => {
      if (!confirm('確定刪除這筆記錄？\n刪除後可從主控 Sheet 還原（清空 deleted_at 欄位）。')) return;
      try {
        await api('delete_record', { sheet_id: state.ledger.id, record_id: rec.id });
        toast('已刪除', 'success');
        state.cache.records = null;
        navigate('ledger', { id: state.ledger.id });
      } catch (e) {
        toast('刪除失敗：' + friendlyErr(e.message), 'error');
      }
    };
  }

  // =====================================================================
  // 10. 頁面：設定
  // =====================================================================
  async function pageSettings() {
    const u = state.user || {};
    const isAdmin = u.role === 'super_admin' || u.role === 'admin';
    const hasAvatar = !!getAvatar();
    render(appShell(`
      <div class="stack">
        <div class="card profile">
          <button class="profile__avatar profile__avatar--clickable" onclick="pickAvatar()" aria-label="更換大頭貼" style="border:none">${avatarHtml(u)}</button>
          <div class="grow">
            <div class="profile__name">${escapeHtml(u.display_name || '')}</div>
            <div class="profile__meta">${escapeHtml(u.account || '')} · <span class="chip chip--soft">${escapeHtml(u.role || '')}</span></div>
            ${ hasAvatar ? '<button onclick="resetAvatar()" style="font-size:11px;color:var(--muted);text-decoration:underline;text-underline-offset:2px;margin-top:4px">移除大頭貼</button>' : '<div style="font-size:11px;color:var(--muted);margin-top:4px">點頭像可上傳照片</div>' }
          </div>
        </div>

        ${ isAdmin ? `
          <div class="card">
            <button class="list-item" onclick="quickCreateSheet()">
              <span class="list-item__icon">📒</span>
              <span class="list-item__label">建立新帳本</span>
              <span class="list-item__chev">›</span>
            </button>
            <button class="list-item" onclick="alert('使用者管理 v0.2 再加 UI；目前可用 API create_user')">
              <span class="list-item__icon"><img class="icon-inline" src="icons/users.png" alt="" /></span>
              <span class="list-item__label">使用者管理（v0.2）</span>
              <span class="list-item__chev">›</span>
            </button>
          </div>` : '' }

        ${ state.ledger && state.ledger.is_owner && state.ledger.visibility === 'private' ? `
          <div class="card">
            <div style="padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px">
              🔐 私人帳本「${escapeHtml(state.ledger.name)}」
            </div>
            <label class="toggle-row">
              <div class="toggle-row__main">
                <div class="toggle-row__title">允許 admin 檢視內容</div>
                <div class="toggle-row__sub">關閉時 admin 看得到名稱但點不進去</div>
              </div>
              <span class="switch">
                <input type="checkbox" id="aav" ${state.ledger.allow_admin_view ? 'checked' : ''} />
                <span class="switch__track"></span><span class="switch__thumb"></span>
              </span>
            </label>
            <label class="toggle-row">
              <div class="toggle-row__main">
                <div class="toggle-row__title">允許進入跨帳本統計</div>
                <div class="toggle-row__sub">數字會匯總進總和，不外流明細</div>
              </div>
              <span class="switch">
                <input type="checkbox" id="aaa" ${state.ledger.allow_admin_aggregate ? 'checked' : ''} />
                <span class="switch__track"></span><span class="switch__thumb"></span>
              </span>
            </label>
            <div style="padding:12px 16px;border-top:1px solid var(--line)">
              <button class="btn btn--primary btn--block" onclick="saveSheetFlags()">儲存變更</button>
            </div>
          </div>` : '' }

        <div class="card">
          <button class="list-item list-item--danger" onclick="logout()">
            <span class="list-item__icon"><img class="icon-inline" src="icons/logout.png" alt="" /></span>
            <span class="list-item__label">登出</span>
          </button>
        </div>

        <div class="center-text" style="font-size:11px;color:var(--muted-2);padding:8px 0 16px">
          by_account · v0.1 ·
          <button onclick="location.hash='reset-url'" style="color:inherit;text-decoration:underline;text-underline-offset:2px">變更連線</button>
        </div>
      </div>
    `, { title: '設定' }));
  }
  function quickCreateSheet() { navigate('new-ledger'); }
  async function saveSheetFlags() {
    try {
      const aav = document.getElementById('aav').checked;
      const aaa = document.getElementById('aaa').checked;
      await api('update_sheet_flags', { sheet_id: state.ledger.id, allow_admin_view: aav, allow_admin_aggregate: aaa });
      setLedger({ ...state.ledger, allow_admin_view: aav, allow_admin_aggregate: aaa });
      toast('已儲存', 'success');
    } catch (e) { toast('失敗：' + friendlyErr(e.message), 'error'); }
  }
  window.quickCreateSheet = quickCreateSheet; window.saveSheetFlags = saveSheetFlags;

  // =====================================================================
  // 10.5 頁面：建立新帳本
  // =====================================================================
  async function pageNewLedger() {
    const tk = _routeToken;
    const me = state.user || {};
    const isAdmin = me.role === 'super_admin' || me.role === 'admin';
    if (!isAdmin) {
      return render(appShell(`
        <div class="card empty">
          <img class="empty__img" src="icons/forbidden.png" alt="" />
          <div class="empty__title">沒有權限</div>
          <div class="empty__hint">只有管理員可以建立帳本</div>
        </div>
      `, { title: '建立帳本', back: true }));
    }

    // 立即顯示 loading 狀態（避免畫面卡在前一頁）
    render(appShell(`<div class="empty"><img class="empty__img empty__img--loading" src="icons/loading.png" alt="" /><div class="empty__hint">讀取中…</div></div>`, { title: '建立新帳本', back: true }));

    // 載入使用者清單（用於 owner 選單）
    let users = [];
    try {
      users = await api('list_users');
      users = users.filter(u => u.status === 'active');
    } catch(e) { users = [{ id: me.id, account: me.account, display_name: me.display_name }]; }

    if (tk !== _routeToken) return;  // 使用者已切到別頁，放棄渲染

    const ownerOptions = users.map(u =>
      `<option value="${u.id}" ${u.id === me.id ? 'selected' : ''}>${escapeHtml(u.display_name || u.account)} (${escapeHtml(u.account)})</option>`
    ).join('');

    render(appShell(`
      <div class="stack">
        <div class="card card__pad stack">
          <div class="field">
            <span class="field__label">帳本名稱</span>
            <input id="lName" class="input" placeholder="例：家庭帳、出國旅遊" autofocus />
          </div>

          <div class="field">
            <span class="field__label">類型</span>
            <div class="radio-group">
              <label class="radio-pill">
                <input type="radio" name="vis" value="shared" checked />
                👥 共同編輯
              </label>
              <label class="radio-pill">
                <input type="radio" name="vis" value="private" />
                🔐 私人
              </label>
            </div>
            <span class="field__hint" id="visHint">所有授權成員都可讀寫；建好後到設定加成員</span>
          </div>

          <div class="field" id="ownerWrap" style="display:none">
            <span class="field__label">擁有者（私人帳本）</span>
            <select id="lOwner" class="select">${ownerOptions}</select>
            <span class="field__hint">擁有者可以決定要不要讓 admin 看內容</span>
          </div>

          <details class="advanced" id="advanced">
            <summary>進階：使用既有 Google Sheet</summary>
            <div class="stack">
              <div class="field">
                <span class="field__label">用法</span>
                <span class="field__hint">
                  • 不填 → 系統會在你的 Drive 自動建一份新試算表<br/>
                  • 填上 → 註冊既有 Sheet（由你或別人事先建好）
                </span>
              </div>
              <div class="field">
                <span class="field__label">Google Sheet ID（選填）</span>
                <input id="lSheetId" class="input" placeholder="貼網址中 /spreadsheets/d/ 後面那串" />
                <span class="field__hint" id="shareHint">
                  ⚠️ 若是別人帳號的 Sheet，對方須先把 Sheet 分享給<br/>
                  <span class="copy-chip">bolin131419@gmail.com</span> 並給<b>編輯者</b>權限
                </span>
              </div>
            </div>
          </details>
        </div>

        <button id="createBtn" class="btn btn--primary btn--lg btn--block">建立帳本</button>
        <button class="btn btn--ghost btn--block" onclick="history.back()">取消</button>
      </div>
    `, { title: '建立新帳本', back: true }));

    // 切換 visibility 時：顯示/隱藏 owner 選單，調整提示文案
    document.querySelectorAll('input[name="vis"]').forEach(r => {
      r.onchange = () => {
        const isPrivate = document.querySelector('input[name="vis"]:checked').value === 'private';
        document.getElementById('ownerWrap').style.display = isPrivate ? '' : 'none';
        document.getElementById('visHint').textContent = isPrivate
          ? '只有指定擁有者可讀寫；admin 預設看不到內容'
          : '所有授權成員都可讀寫；建好後到設定加成員';
      };
    });

    document.getElementById('createBtn').onclick = async () => {
      const name = document.getElementById('lName').value.trim();
      if (!name) return toast('請輸入帳本名稱', 'error');
      const visibility = document.querySelector('input[name="vis"]:checked').value;
      const owner_user_id = visibility === 'private'
        ? document.getElementById('lOwner').value
        : me.id;
      const google_sheet_id = document.getElementById('lSheetId').value.trim();

      const btn = document.getElementById('createBtn');
      btn.disabled = true; btn.textContent = '建立中…';
      try {
        await api('create_sheet', {
          name, visibility, owner_user_id,
          google_sheet_id: google_sheet_id || undefined
        });
        toast('建立成功 ✨', 'success');
        state.cache.sheets = null;
        navigate('home');
      } catch (e) {
        toast('失敗：' + friendlyErr(e.message), 'error');
        btn.disabled = false; btn.textContent = '建立帳本';
      }
    };
  }

  // =====================================================================
  // 11. 頁面：手動 URL 設定（緊急覆寫）
  // =====================================================================
  function pageSetupUrl(allowCancel) {
    render(`
      <div class="center-page">
        <div class="card login-card">
          <div class="login-hero">
            <img class="logo logo--img" src="icons/connection.png" alt="" />
            <div class="login-hero__title">變更連線設定</div>
            <div class="login-hero__sub">緊急情況用：覆寫 Apps Script Web App 網址</div>
          </div>
          <div class="stack">
            <input id="urlInput" class="input" placeholder="https://script.google.com/macros/s/.../exec" value="${state.url || ''}" />
            <button id="saveBtn" class="btn btn--primary btn--block">儲存並繼續</button>
            ${allowCancel ? '<button id="cancelBtn" class="btn btn--ghost btn--block">取消</button>' : ''}
            <button id="resetBtn" class="btn btn--ghost btn--block">恢復為預設網址</button>
          </div>
        </div>
      </div>
    `);
    document.getElementById('saveBtn').onclick = async () => {
      const v = document.getElementById('urlInput').value.trim();
      if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(v)) return toast('URL 格式不對', 'error');
      setUrl(v); toast('已儲存', 'success');
      navigate(state.token ? 'home' : 'login');
    };
    document.getElementById('resetBtn').onclick = () => {
      localStorage.removeItem(LS_URL); state.url = WEB_APP_URL;
      toast('已恢復預設', 'success');
      navigate(state.token ? 'home' : 'login');
    };
    if (allowCancel) document.getElementById('cancelBtn').onclick = () => history.back();
  }

  // =====================================================================
  // 12. PWA + 啟動
  // =====================================================================
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
  scheduleExpiryCheck();   // 載入時若已過期，立即踢回 login
  routeFromHash();
  </script>
</body>
</html>
