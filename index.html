<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF7F2" />
  <title>by_account · 記帳</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // 主題：蜂蜜拿鐵（見 docs/DESIGN.md）
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            warmBg:  '#FAF7F2',
            surface: '#FFFFFF',
            ink:     '#3F2D20',
            muted:   '#8B7B6E',
            line:    '#EDE6DD',
            soft:    '#F5EFE6',
            honey: { 100:'#FCEFD6', 400:'#EFB155', 500:'#E29A2D', 600:'#C57E1B', 700:'#9C6314' },
            mint:    '#5BA876',
            brick:   '#C95B4D',
            yolk:    '#E0B340',
            lilac:   '#7E6B9E'
          },
          fontFamily: {
            sans: ['-apple-system','Noto Sans TC','PingFang TC','Microsoft JhengHei','system-ui','sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    html, body { height: 100%; }
    body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; font-feature-settings: 'tnum' on; }
    .safe-bottom { padding-bottom: max(env(safe-area-inset-bottom), 0.75rem); }
    .safe-top { padding-top: max(env(safe-area-inset-top), 0.5rem); }
    .num { font-variant-numeric: tabular-nums; font-weight: 600; }
    .shadow-card { box-shadow: 0 1px 2px rgba(63,45,32,.04), 0 1px 8px rgba(63,45,32,.04); }
    .shadow-honey { box-shadow: 0 2px 0 rgba(197,126,27,.25); }
    .nav-dot { width: 4px; height: 4px; border-radius: 9999px; background: #E29A2D; margin: 2px auto 0; }
  </style>
  <style type="text/tailwindcss">
    @layer components {
      .input { @apply w-full rounded-2xl border border-line bg-white px-4 py-3 text-base text-ink placeholder:text-muted/70 outline-none transition focus:border-honey-500 focus:ring-4 focus:ring-honey-100; }
      .btn  { @apply inline-flex items-center justify-center rounded-2xl px-5 py-2.5 text-sm font-semibold transition active:scale-[.97]; }
      .btn-primary { @apply btn bg-honey-500 text-white hover:bg-honey-600 shadow-honey; }
      .btn-ghost   { @apply btn bg-soft text-ink hover:bg-line; }
      .btn-danger  { @apply btn bg-white text-brick border border-brick/30 hover:bg-brick/5; }
      .card { @apply rounded-3xl bg-surface shadow-card border border-line; }
      .chip { @apply inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-xs font-medium; }
    }
  </style>
</head>
<body class="bg-warmBg text-ink antialiased font-sans">
  <div id="app"></div>

  <!-- Toast -->
  <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 hidden">
    <div id="toast-msg" class="px-4 py-2.5 rounded-full shadow-lg text-sm text-white bg-ink"></div>
  </div>

  <script>
  // =====================================================================
  // 1. 設定 / 狀態
  // =====================================================================
  const LS_URL    = 'by_account:web_app_url';
  const LS_TOKEN  = 'by_account:session_token';
  const LS_USER   = 'by_account:user';
  const LS_LEDGER = 'by_account:current_ledger';

  const state = {
    url:    localStorage.getItem(LS_URL) || '',
    token:  localStorage.getItem(LS_TOKEN) || '',
    user:   JSON.parse(localStorage.getItem(LS_USER) || 'null'),
    ledger: JSON.parse(localStorage.getItem(LS_LEDGER) || 'null'),
    page: '',
    cache: { sheets: null, accounts: null, categories: null }
  };

  function setUrl(v)   { state.url = v; localStorage.setItem(LS_URL, v); }
  function setToken(v) { state.token = v; localStorage.setItem(LS_TOKEN, v); }
  function setUser(v)  { state.user = v; localStorage.setItem(LS_USER, JSON.stringify(v)); }
  function setLedger(v){ state.ledger = v; localStorage.setItem(LS_LEDGER, JSON.stringify(v)); state.cache = { sheets: state.cache.sheets, accounts: null, categories: null }; }
  function clearAuth() { setToken(''); setUser(null); setLedger(null); state.cache = { sheets: null, accounts: null, categories: null }; }

  // =====================================================================
  // 2. API
  // =====================================================================
  async function api(action, payload) {
    if (!state.url) throw new Error('未設定 Web App URL');
    const body = JSON.stringify({ action, payload: payload || {}, session_token: state.token });
    const res = await fetch(state.url, {
      method: 'POST',
      // text/plain 避開 CORS preflight
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body
    });
    const json = await res.json().catch(() => ({ ok: false, error: 'bad_response' }));
    if (!json.ok) {
      if (json.error === 'invalid_session' || json.error === 'session_expired' || json.error === 'not_logged_in') {
        clearAuth();
        navigate('login');
      }
      throw new Error(json.error || json.message || '未知錯誤');
    }
    return json.data;
  }

  // =====================================================================
  // 3. UI 工具
  // =====================================================================
  function el(html) {
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstChild;
  }
  function render(html) {
    const root = document.getElementById('app');
    root.innerHTML = '';
    root.appendChild(el(html));
  }
  function toast(msg, kind) {
    const box = document.getElementById('toast');
    const m = document.getElementById('toast-msg');
    m.textContent = msg;
    m.className = 'px-4 py-2.5 rounded-full shadow-lg text-sm text-white ' +
      (kind === 'error' ? 'bg-brick' : kind === 'success' ? 'bg-mint' : 'bg-ink');
    box.classList.remove('hidden');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => box.classList.add('hidden'), 2400);
  }
  function fmtMoney(n, cur) {
    const s = Number(n).toLocaleString('zh-TW', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    return (cur || 'TWD') === 'TWD' ? '$' + s : s + ' ' + cur;
  }
  function todayIso() { return new Date().toISOString().slice(0,10); }

  // =====================================================================
  // 4. Router
  // =====================================================================
  function navigate(page, params) {
    state.page = page;
    location.hash = '#' + page + (params ? '?' + new URLSearchParams(params) : '');
    routeFromHash();
  }
  function routeFromHash() {
    const raw = location.hash.replace(/^#/, '') || 'home';
    const [page, query] = raw.split('?');
    const params = Object.fromEntries(new URLSearchParams(query || ''));

    if (!state.url)   return pageSetupUrl();
    if (!state.token && page !== 'login') return pageLogin();

    switch (page) {
      case 'login':       return pageLogin();
      case 'home':        return pageHome();
      case 'ledger':      return pageLedger(params);
      case 'add':         return pageAddRecord(params);
      case 'settings':    return pageSettings();
      case 'reset-url':   return pageSetupUrl(true);
      default:            return pageHome();
    }
  }
  window.addEventListener('hashchange', routeFromHash);

  // =====================================================================
  // 5. 頁面：設定 URL
  // =====================================================================
  function pageSetupUrl(allowCancel) {
    render(`
      <div class="min-h-screen flex items-center justify-center p-4">
        <div class="card w-full max-w-md p-7 space-y-5">
          <div class="text-center">
            <div class="text-5xl mb-2">🔌</div>
            <h1 class="text-xl font-bold">連線設定</h1>
            <p class="text-sm text-muted mt-1">先填入 Apps Script Web App 的部署網址，<br/>之後會記住，不用再填囉。</p>
          </div>
          <input id="urlInput" class="input" placeholder="https://script.google.com/macros/s/.../exec" value="${state.url || ''}" />
          <div class="flex gap-2">
            <button id="saveBtn" class="btn-primary flex-1">儲存並繼續</button>
            ${allowCancel ? '<button id="cancelBtn" class="btn-ghost">取消</button>' : ''}
          </div>
        </div>
      </div>
    `);
    document.getElementById('saveBtn').onclick = async () => {
      const v = document.getElementById('urlInput').value.trim();
      if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(v)) {
        return toast('URL 格式不對', 'error');
      }
      setUrl(v);
      // 健康檢查
      try {
        const r = await fetch(v).then(r => r.json());
        if (!r.ok) throw new Error('健康檢查失敗');
      } catch (e) {
        return toast('連不上：' + e.message, 'error');
      }
      toast('已連線', 'success');
      navigate(state.token ? 'home' : 'login');
    };
    if (allowCancel) document.getElementById('cancelBtn').onclick = () => navigate('settings');
  }

  // =====================================================================
  // 6. 頁面：登入
  // =====================================================================
  function pageLogin() {
    render(`
      <div class="min-h-screen flex items-center justify-center p-4">
        <div class="card w-full max-w-sm p-7 space-y-5">
          <div class="text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-honey-100 text-3xl mb-2">🍯</div>
            <h1 class="text-2xl font-bold tracking-tight">by_account</h1>
            <p class="text-sm text-muted mt-1">歡迎回來，請登入</p>
          </div>
          <div class="space-y-3">
            <input id="account"  class="input" placeholder="帳號" autocomplete="username" />
            <input id="password" class="input" placeholder="密碼" type="password" autocomplete="current-password" />
            <label class="flex items-center gap-2 text-sm text-ink/80 select-none">
              <input type="checkbox" id="remember" class="w-4 h-4 rounded accent-honey-500" />
              記住我（30 天）
            </label>
          </div>
          <button id="loginBtn" class="btn-primary w-full py-3 text-base">登入</button>
          <button id="resetUrlBtn" class="text-xs text-muted/70 mx-auto block hover:text-muted">重設 Web App URL</button>
        </div>
      </div>
    `);
    document.getElementById('loginBtn').onclick = doLogin;
    document.getElementById('password').onkeydown = e => { if (e.key === 'Enter') doLogin(); };
    document.getElementById('resetUrlBtn').onclick = () => navigate('reset-url');
    setTimeout(() => document.getElementById('account').focus(), 50);
  }
  async function doLogin() {
    const account = document.getElementById('account').value.trim();
    const password = document.getElementById('password').value;
    const remember = document.getElementById('remember').checked;
    if (!account || !password) return toast('請輸入帳號與密碼', 'error');
    try {
      const r = await api('login', { account, password, remember_me: remember, user_agent: navigator.userAgent });
      setToken(r.session_token);
      setUser(r.user);
      navigate('home');
    } catch (e) {
      toast('登入失敗：' + e.message, 'error');
    }
  }

  // =====================================================================
  // 7. 共用 layout（已登入頁面）
  // =====================================================================
  function appShell(content, opts) {
    opts = opts || {};
    const title = opts.title || 'by_account';
    const back = opts.back ? `<button onclick="history.back()" class="w-9 h-9 rounded-full hover:bg-soft active:bg-line transition flex items-center justify-center text-xl leading-none text-ink">←</button>` : '<div class="w-9"></div>';
    return `
      <div class="min-h-screen flex flex-col">
        <header class="safe-top sticky top-0 z-30 bg-warmBg/90 backdrop-blur border-b border-line/70">
          <div class="flex items-center justify-between px-3 py-2">
            ${back}
            <h1 class="text-base font-bold tracking-tight">${title}</h1>
            <button onclick="(${showMenu.toString()})()" class="w-9 h-9 rounded-full hover:bg-soft active:bg-line transition flex items-center justify-center text-xl leading-none text-muted">⋮</button>
          </div>
        </header>
        <main class="flex-1 px-4 py-4 pb-28">${content}</main>
        <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur border-t border-line safe-bottom shadow-[0_-2px_8px_rgba(63,45,32,0.04)]">
          <div class="grid grid-cols-3">
            <button onclick="location.hash='home'"     class="py-3 text-xs ${state.page==='home'?'text-honey-600 font-semibold':'text-muted'}">🏠 帳本${state.page==='home'?'<div class=\"nav-dot\"></div>':''}</button>
            <button onclick="location.hash='add'"      class="py-3 text-xs ${state.page==='add'?'text-honey-600 font-semibold':'text-muted'}">➕ 記帳${state.page==='add'?'<div class=\"nav-dot\"></div>':''}</button>
            <button onclick="location.hash='settings'" class="py-3 text-xs ${state.page==='settings'?'text-honey-600 font-semibold':'text-muted'}">⚙️ 設定${state.page==='settings'?'<div class=\"nav-dot\"></div>':''}</button>
          </div>
        </nav>
      </div>
    `;
  }
  // 全域 menu（簡易）
  function showMenu() {
    const u = JSON.parse(localStorage.getItem('by_account:user') || '{}');
    const html = `
      <div id="overlay" class="fixed inset-0 bg-ink/40 z-50 flex justify-end">
        <div class="bg-warmBg w-3/4 max-w-xs h-full p-5 flex flex-col gap-3 shadow-2xl">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-honey-100 flex items-center justify-center text-2xl">🍯</div>
            <div>
              <div class="font-semibold text-ink">${u.display_name || u.account || ''}</div>
              <div class="text-xs text-muted">${u.role || ''}</div>
            </div>
          </div>
          <hr class="border-line my-1"/>
          <button onclick="location.hash='settings';document.getElementById('overlay').remove()" class="text-left py-2.5 px-2 rounded-xl active:bg-soft text-ink">⚙️ 設定</button>
          <button onclick="logout()" class="text-left py-2.5 px-2 rounded-xl active:bg-brick/5 text-brick">🚪 登出</button>
          <div class="mt-auto text-xs text-muted/70 text-center">by_account · v0.1</div>
        </div>
      </div>
    `;
    const div = document.createElement('div');
    div.innerHTML = html;
    document.body.appendChild(div.firstElementChild);
    document.getElementById('overlay').onclick = (e) => {
      if (e.target.id === 'overlay') e.target.remove();
    };
  }
  async function logout() {
    try { await api('logout'); } catch (e) {}
    clearAuth();
    document.getElementById('overlay')?.remove();
    navigate('login');
  }
  window.logout = logout;

  // =====================================================================
  // 8. 頁面：首頁（帳本列表）
  // =====================================================================
  async function pageHome() {
    render(appShell(`<div class="text-center text-muted/70 py-8">載入中…</div>`, { title: '我的帳本' }));
    let sheets;
    try {
      sheets = await api('list_my_sheets');
      state.cache.sheets = sheets;
    } catch (e) {
      return render(appShell(`<div class="card p-4 text-brick">載入失敗：${e.message}</div>`, { title: '我的帳本' }));
    }
    if (!sheets.length) {
      return render(appShell(`
        <div class="card p-8 text-center space-y-3">
          <div class="text-5xl">📒</div>
          <div class="font-semibold text-ink">還沒有任何帳本</div>
          <p class="text-sm text-muted">${state.user.role==='user' ? '請聯絡管理員開一本給你 🙋' : '到「設定」建立第一本帳本吧 ✨'}</p>
        </div>
      `, { title: '我的帳本' }));
    }
    const items = sheets.map(s => {
      const bgIcon = s.locked ? 'bg-lilac/15' : (s.visibility==='private' ? 'bg-lilac/15' : 'bg-honey-100');
      const icon = s.locked ? '🔒' : (s.visibility==='private' ? '🔐' : '👥');
      const visBadge = s.locked
        ? '<span class="chip bg-lilac/15 text-lilac">🔒 無權檢視</span>'
        : (s.visibility==='private'
            ? '<span class="chip bg-lilac/15 text-lilac">私人</span>'
            : '<span class="chip bg-honey-100 text-honey-700">共同</span>');
      return `
        <button class="w-full text-left card p-4 active:scale-[.98] transition hover:shadow-md" data-id="${s.id}" data-locked="${s.locked}">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl ${bgIcon} flex items-center justify-center text-2xl shrink-0">${icon}</div>
            <div class="flex-1 min-w-0">
              <div class="font-semibold truncate">${escapeHtml(s.name)}</div>
              <div class="mt-1 flex items-center gap-1.5 text-xs">${visBadge}<span class="text-muted">· ${s.role}</span></div>
            </div>
            <div class="text-muted/70 text-lg">›</div>
          </div>
        </button>
      `;
    }).join('');
    render(appShell(`<div class="space-y-3">${items}</div>`, { title: '我的帳本' }));
    document.querySelectorAll('[data-id]').forEach(b => {
      b.onclick = () => {
        if (b.dataset.locked === 'true') return toast('該帳本擁有者尚未授權', 'error');
        const id = b.dataset.id;
        const sheet = sheets.find(x => x.id === id);
        setLedger(sheet);
        navigate('ledger', { id });
      };
    });
  }

  // =====================================================================
  // 9. 頁面：單一帳本記錄列表
  // =====================================================================
  async function pageLedger(params) {
    if (!state.ledger) return navigate('home');
    const ledger = state.ledger;
    const now = new Date();
    const year  = Number(params.year)  || now.getFullYear();
    const month = Number(params.month) || (now.getMonth()+1);

    render(appShell(`<div class="text-center text-muted/70 py-8">載入中…</div>`, { title: ledger.name, back: true }));
    let res, cats, accts;
    try {
      [res, cats, accts] = await Promise.all([
        api('list_records',    { sheet_id: ledger.id, year, month, limit: 500 }),
        api('list_categories', { sheet_id: ledger.id }),
        api('list_accounts',   { sheet_id: ledger.id })
      ]);
      state.cache.categories = cats;
      state.cache.accounts = accts;
    } catch (e) {
      return render(appShell(`<div class="card p-4 text-brick">載入失敗：${e.message}</div>`, { title: ledger.name, back: true }));
    }

    const catMap = {}; cats.forEach(c => catMap[c.id] = c);
    const acctMap = {}; accts.forEach(a => acctMap[a.id] = a);

    const inc = res.items.filter(r => r.type === 'income').reduce((s,r) => s + Number(r.amount), 0);
    const exp = res.items.filter(r => r.type === 'expense').reduce((s,r) => s + Number(r.amount), 0);

    const grouped = {};
    res.items.forEach(r => { (grouped[r.date] = grouped[r.date] || []).push(r); });
    const dates = Object.keys(grouped).sort().reverse();

    const list = dates.length ? dates.map(d => `
      <div class="space-y-2">
        <div class="text-xs text-muted px-1.5 font-medium">${d}</div>
        <div class="card divide-y divide-line/70 overflow-hidden">
          ${grouped[d].map(r => recordRow(r, catMap, acctMap, ledger.currency)).join('')}
        </div>
      </div>
    `).join('') : `
      <div class="card p-10 text-center space-y-2">
        <div class="text-5xl">🌱</div>
        <div class="text-muted text-sm">這個月還沒記帳，<br/>從下方 ➕ 開始吧</div>
      </div>`;

    render(appShell(`
      <div class="space-y-4">
        <div class="card p-5">
          <div class="flex items-center justify-between mb-3">
            <button onclick="changeMonth(${year},${month},-1)" class="w-9 h-9 rounded-full hover:bg-soft active:bg-line text-muted text-lg leading-none">‹</button>
            <div class="font-bold text-base">${year} 年 ${month} 月</div>
            <button onclick="changeMonth(${year},${month},1)" class="w-9 h-9 rounded-full hover:bg-soft active:bg-line text-muted text-lg leading-none">›</button>
          </div>
          <div class="grid grid-cols-3 text-center">
            <div class="border-r border-line">
              <div class="text-xs text-muted mb-0.5">收入</div>
              <div class="text-mint num text-base">${fmtMoney(inc, ledger.currency)}</div>
            </div>
            <div class="border-r border-line">
              <div class="text-xs text-muted mb-0.5">支出</div>
              <div class="text-brick num text-base">${fmtMoney(exp, ledger.currency)}</div>
            </div>
            <div>
              <div class="text-xs text-muted mb-0.5">結餘</div>
              <div class="num text-base text-ink">${fmtMoney(inc-exp, ledger.currency)}</div>
            </div>
          </div>
        </div>
        ${ res.is_admin_view ? '<div class="rounded-2xl p-3 text-xs text-ink/80 bg-yolk/15 border border-yolk/40">⚠️ 你正以 admin 身分檢視此帳本，動作已記錄囉。</div>' : '' }
        ${list}
      </div>
    `, { title: ledger.name, back: true }));
  }
  function recordRow(r, catMap, acctMap, cur) {
    const cat = catMap[r.category_id];
    const acct = acctMap[r.account_id];
    const sign = r.type === 'income' ? '+' : (r.type === 'expense' ? '−' : '↔');
    const color = r.type === 'income' ? 'text-mint' : (r.type === 'expense' ? 'text-brick' : 'text-muted');
    const iconBg = r.type === 'transfer' ? 'bg-soft' : 'bg-honey-100';
    const icon = r.type === 'transfer' ? '🔄' : (cat ? cat.icon : '📌');
    const label = r.type === 'transfer'
      ? `${acct ? acct.name : ''} → ${(acctMap[r.transfer_to_account_id] || {}).name || ''}`
      : (cat ? cat.name : '未分類');
    const sub = [r.note, acct && acct.name].filter(Boolean).map(escapeHtml).join(' · ');
    return `
      <div class="px-4 py-3 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl ${iconBg} flex items-center justify-center text-xl shrink-0">${icon}</div>
        <div class="flex-1 min-w-0">
          <div class="font-medium truncate text-ink">${escapeHtml(label)}</div>
          ${sub ? `<div class="text-xs text-muted truncate mt-0.5">${sub}</div>` : ''}
        </div>
        <div class="${color} num">${sign}${fmtMoney(r.amount, cur)}</div>
      </div>
    `;
  }
  function changeMonth(y, m, d) {
    let ny = y, nm = m + d;
    if (nm > 12) { nm = 1; ny++; }
    if (nm < 1)  { nm = 12; ny--; }
    navigate('ledger', { id: state.ledger.id, year: ny, month: nm });
  }
  window.changeMonth = changeMonth;

  // =====================================================================
  // 10. 頁面：新增記錄
  // =====================================================================
  async function pageAddRecord() {
    if (!state.ledger) {
      render(appShell(`<div class="card p-4">請先到首頁選擇一個帳本</div>`, { title: '記帳' }));
      return;
    }
    let cats = state.cache.categories, accts = state.cache.accounts;
    if (!cats || !accts) {
      render(appShell(`<div class="text-center text-muted/70 py-8">載入中…</div>`, { title: '記帳' }));
      try {
        [cats, accts] = await Promise.all([
          api('list_categories', { sheet_id: state.ledger.id }),
          api('list_accounts',   { sheet_id: state.ledger.id })
        ]);
        state.cache.categories = cats; state.cache.accounts = accts;
      } catch (e) {
        return render(appShell(`<div class="card p-4 text-brick">${e.message}</div>`, { title: '記帳' }));
      }
    }
    const expCats = cats.filter(c => c.type === 'expense');
    const incCats = cats.filter(c => c.type === 'income');

    render(appShell(`
      <div class="space-y-4">
        <div class="card p-4 flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-honey-100 flex items-center justify-center text-xl">📒</div>
          <div class="flex-1 min-w-0">
            <div class="text-xs text-muted">當前帳本</div>
            <div class="font-semibold truncate">${escapeHtml(state.ledger.name)}</div>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <button data-type="expense"  class="type-btn btn-ghost py-3 ring-2 ring-brick/40">💸 支出</button>
          <button data-type="income"   class="type-btn btn-ghost py-3">💰 收入</button>
          <button data-type="transfer" class="type-btn btn-ghost py-3">🔄 轉帳</button>
        </div>

        <div class="card p-4 space-y-3">
          <input id="amount" class="input text-2xl text-right" inputmode="decimal" placeholder="0" />
          <input id="date" class="input" type="date" value="${todayIso()}" />

          <div id="catWrap">
            <div class="text-xs text-muted mb-1">類別</div>
            <div id="catGrid" class="grid grid-cols-4 gap-2"></div>
          </div>

          <div>
            <div class="text-xs text-muted mb-1">帳戶</div>
            <select id="acct" class="input">
              ${accts.map(a => `<option value="${a.id}">${escapeHtml(a.name)}</option>`).join('')}
            </select>
          </div>

          <div id="acct2Wrap" class="hidden">
            <div class="text-xs text-muted mb-1">轉入帳戶</div>
            <select id="acct2" class="input">
              ${accts.map(a => `<option value="${a.id}">${escapeHtml(a.name)}</option>`).join('')}
            </select>
          </div>

          <textarea id="note" class="input" rows="2" placeholder="備註（選填）"></textarea>
        </div>

        <button id="saveBtn" class="btn-primary w-full py-3 text-base">儲存</button>
      </div>
    `, { title: '記帳', back: true }));

    let curType = 'expense';
    let curCatId = null;
    function paintCats() {
      const list = curType === 'income' ? incCats : (curType === 'expense' ? expCats : []);
      const wrap = document.getElementById('catWrap');
      const a2 = document.getElementById('acct2Wrap');
      if (curType === 'transfer') { wrap.classList.add('hidden'); a2.classList.remove('hidden'); return; }
      wrap.classList.remove('hidden'); a2.classList.add('hidden');
      const grid = document.getElementById('catGrid');
      grid.innerHTML = list.map(c => `
        <button data-cid="${c.id}" class="cat-btn rounded-2xl border border-line bg-white py-3 text-xs flex flex-col items-center gap-1 active:bg-soft transition">
          <span class="text-2xl">${c.icon || '•'}</span><span class="text-ink/80">${escapeHtml(c.name)}</span>
        </button>
      `).join('');
      grid.querySelectorAll('.cat-btn').forEach(b => {
        b.onclick = () => {
          curCatId = b.dataset.cid;
          grid.querySelectorAll('.cat-btn').forEach(x => { x.classList.remove('ring-2','ring-honey-500','bg-honey-100','border-honey-500'); x.classList.add('bg-white'); });
          b.classList.remove('bg-white');
          b.classList.add('ring-2','ring-honey-500','bg-honey-100','border-honey-500');
        };
      });
    }
    paintCats();

    document.querySelectorAll('.type-btn').forEach(b => {
      b.onclick = () => {
        curType = b.dataset.type;
        document.querySelectorAll('.type-btn').forEach(x => x.classList.remove('ring-2','ring-brick/40','ring-mint/40','ring-muted/40'));
        const ringCls = curType === 'expense' ? 'ring-brick/40' : curType === 'income' ? 'ring-mint/40' : 'ring-muted/40';
        b.classList.add('ring-2', ringCls);
        curCatId = null;
        paintCats();
      };
    });

    document.getElementById('saveBtn').onclick = async () => {
      const amount = Number(document.getElementById('amount').value);
      const date = document.getElementById('date').value;
      const account_id = document.getElementById('acct').value;
      const note = document.getElementById('note').value;
      if (!amount || amount <= 0) return toast('請輸入金額', 'error');
      if (!date) return toast('請選日期', 'error');
      const payload = { sheet_id: state.ledger.id, type: curType, amount, date, account_id, note };
      if (curType === 'transfer') {
        payload.transfer_to_account_id = document.getElementById('acct2').value;
        if (payload.account_id === payload.transfer_to_account_id) return toast('同一帳戶不可互轉', 'error');
      } else {
        if (!curCatId) return toast('請選類別', 'error');
        payload.category_id = curCatId;
      }
      try {
        await api('create_record', payload);
        toast('已記錄', 'success');
        navigate('ledger', { id: state.ledger.id });
      } catch (e) {
        toast('儲存失敗：' + e.message, 'error');
      }
    };
  }

  // =====================================================================
  // 11. 頁面：設定（簡版）
  // =====================================================================
  async function pageSettings() {
    const u = state.user || {};
    const isAdmin = u.role === 'super_admin' || u.role === 'admin';
    render(appShell(`
      <div class="space-y-4">
        <div class="card p-4">
          <div class="text-xs text-muted">登入身分</div>
          <div class="font-semibold">${escapeHtml(u.display_name || '')}</div>
          <div class="text-xs text-muted mt-1">${u.account} · ${u.role}</div>
        </div>

        ${ isAdmin ? `
        <div class="card divide-y divide-line/70">
          <button onclick="quickCreateSheet()" class="w-full text-left px-4 py-3 active:bg-soft">📒 建立新帳本</button>
          <button onclick="alert('Phase 2 再加 UI；目前可用 API create_user')" class="w-full text-left px-4 py-3 active:bg-soft">👤 使用者管理（v0.2）</button>
        </div>` : ''}

        ${ state.ledger && state.ledger.is_owner && state.ledger.visibility === 'private' ? `
        <div class="card p-4 space-y-3">
          <div class="text-sm font-semibold">私人帳本「${escapeHtml(state.ledger.name)}」</div>
          <label class="flex items-center justify-between">
            <span class="text-sm">允許 admin 檢視內容</span>
            <input type="checkbox" id="aav" ${state.ledger.allow_admin_view ? 'checked' : ''} />
          </label>
          <label class="flex items-center justify-between">
            <span class="text-sm">允許進入跨帳本統計</span>
            <input type="checkbox" id="aaa" ${state.ledger.allow_admin_aggregate ? 'checked' : ''} />
          </label>
          <button onclick="saveSheetFlags()" class="btn-primary w-full">儲存</button>
        </div>` : ''}

        <div class="card divide-y divide-line/70">
          <button onclick="location.hash='reset-url'" class="w-full text-left px-4 py-3 active:bg-soft text-sm">🔌 變更 Web App URL</button>
          <button onclick="logout()" class="w-full text-left px-4 py-3 active:bg-soft text-sm text-brick">🚪 登出</button>
        </div>
      </div>
    `, { title: '設定' }));
  }
  async function quickCreateSheet() {
    const name = prompt('帳本名稱？');
    if (!name) return;
    const visibility = confirm('要設為「私人帳本」嗎？\n（OK = 私人 / 取消 = 共同編輯）') ? 'private' : 'shared';
    try {
      await api('create_sheet', { name, visibility });
      toast('已建立', 'success');
      state.cache.sheets = null;
      navigate('home');
    } catch (e) { toast('失敗：' + e.message, 'error'); }
  }
  async function saveSheetFlags() {
    try {
      await api('update_sheet_flags', {
        sheet_id: state.ledger.id,
        allow_admin_view: document.getElementById('aav').checked,
        allow_admin_aggregate: document.getElementById('aaa').checked
      });
      const updated = { ...state.ledger,
        allow_admin_view: document.getElementById('aav').checked,
        allow_admin_aggregate: document.getElementById('aaa').checked
      };
      setLedger(updated);
      toast('已儲存', 'success');
    } catch (e) { toast('失敗：' + e.message, 'error'); }
  }
  window.quickCreateSheet = quickCreateSheet;
  window.saveSheetFlags = saveSheetFlags;

  // =====================================================================
  // 12. 工具
  // =====================================================================
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, m =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  // =====================================================================
  // 13. PWA service worker
  // =====================================================================
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }

  // =====================================================================
  // 14. 啟動
  // =====================================================================
  routeFromHash();
  </script>
</body>
</html>
